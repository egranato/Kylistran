<div class="page editor">
  <div class="editor__header">
    <h1>Editor</h1>
    <div class="editor__header-links">
      <a routerLink="/editor/universes">Universes</a>
      <a routerLink="/editor/characters">Characters</a>
      <button type="button" class="editor__logout" (click)="logout()">Sign out</button>
    </div>
  </div>

  @if (error()) {
    <p class="editor__error">{{ error() }}</p>
  }

  <ul class="editor__list">
    @for (book of books(); track book.id; let i = $index) {
      <li class="editor__row">
        <div class="editor__reorder">
          <button type="button" (click)="move(i, -1)" [disabled]="i === 0">&uarr;</button>
          <button type="button" (click)="move(i, 1)" [disabled]="i === books().length - 1">&darr;</button>
        </div>
        <input class="editor__title" [(ngModel)]="book.title" (blur)="save(book)" placeholder="Title" />
        <input class="editor__slug" [(ngModel)]="book.slug" (blur)="save(book)" placeholder="slug" />
        <input
          class="editor__description"
          [(ngModel)]="book.description"
          (blur)="save(book)"
          placeholder="Description (optional)"
        />
        <label class="editor__hidden-toggle">
          <input type="checkbox" [(ngModel)]="book.hidden" (change)="save(book)" />
          Hidden
        </label>
        <select
          class="editor__universe"
          [ngModel]="book.universeId ?? null"
          (ngModelChange)="book.universeId = $event; save(book)"
        >
          <option [ngValue]="null">No universe</option>
          @for (universe of universes(); track universe.id) {
            <option [ngValue]="universe.id">{{ universe.name }}</option>
          }
        </select>
        <a class="editor__chapters-link" [routerLink]="[book.id]">Chapters &rarr;</a>
        <button type="button" class="editor__delete" (click)="remove(book)">Delete</button>
      </li>
    }
  </ul>

  <form class="editor__new" (submit)="$event.preventDefault(); create()">
    <h2>New book</h2>
    <input
      [ngModel]="newTitle()"
      (ngModelChange)="newTitle.set($event)"
      name="newTitle"
      placeholder="Title"
    />
    <input [ngModel]="newSlug()" (ngModelChange)="newSlug.set($event)" name="newSlug" placeholder="slug" />
    <input
      [ngModel]="newDescription()"
      (ngModelChange)="newDescription.set($event)"
      name="newDescription"
      placeholder="Description (optional)"
    />
    <button type="submit">Create</button>
  </form>
</div>
