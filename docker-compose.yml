services:
  kylistran-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: kylistran-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/kylistran.db
      PORT: "8080"
    volumes:
      - kylistran_data:/data
    networks:
      - edge
    expose:
      - "8080"
    mem_limit: 128m
    cpus: "0.5"

networks:
  edge:
    external: true

volumes:
  kylistran_data:
